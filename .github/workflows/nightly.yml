# CI for every push, plus an optional nightly redeploy.
#
# Vercel builds the site itself (including the card database) on every push to
# main, using `npm run build:full` from vercel.json. The app refreshes prices
# for the cards you own straight from Scryfall each day, so a nightly rebuild
# is optional. It picks up newly released sets and refreshes the 30-day price
# averages. To turn it on:
#   1. Vercel › mtgdb project › Settings › Git › Deploy Hooks: create a hook for
#      branch "main" and copy its URL.
#   2. GitHub › repo Settings › Secrets and variables › Actions: add a secret
#      named VERCEL_DEPLOY_HOOK with that URL.
name: CI and nightly refresh

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 11 * * *' # daily, after Scryfall's price refresh
  workflow_dispatch:

jobs:
  test:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  refresh:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Vercel to rebuild with fresh card data
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK is not set; skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK"
